name: 국내 ETF 구성종목 갱신

on:
  schedule:
    - cron: "17 10 * * 1"   # 매주 월요일 10:17 UTC (한국 19:17). PDF는 매일 바뀌지만 비중 변화가 작아 주 1회로 충분
  workflow_dispatch:        # Actions 탭에서 'Run workflow'로 바로 실행

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 수집
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          python -m pipeline.kr_holdings
          python -m pipeline.publish
      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs cache reports
          if git diff --cached --quiet; then echo "바뀐 내용 없음"; exit 0; fi
          git commit -m "국내 ETF 구성종목 갱신 $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
